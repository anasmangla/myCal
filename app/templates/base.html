<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>myCal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.CALENDAR_DATA = {
        events: {{ event_json|safe }},
        styles: {{ styles_json|safe }},
        holidays: {{ holiday_json|safe }},
        longWeekends: {{ long_weekend_json|safe }},
        weeks: {{ week_json|safe }},
        selectedMonth: {{ selected_month }},
        selectedYear: {{ selected_year }},
        includeHolidays: {{ 'true' if include_holidays else 'false' }},
        includeIslamic: {{ 'true' if include_islamic else 'false' }},
      };
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
