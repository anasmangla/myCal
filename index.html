<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>myCal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="app/static/css/styles.css">
  </head>
  <body>
    <div class="container-fluid py-4 app-shell">
      <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4 no-print">
        <div>
          <h1 class="h3 mb-1">myCal Monthly Planner</h1>
        </div>
        <form class="row g-2 align-items-center" id="calendarControls">
          <div class="col-auto">
            <select class="form-select" id="monthSelect" aria-label="Month"></select>
          </div>
          <div class="col-auto">
            <select class="form-select" id="yearSelect" aria-label="Year"></select>
          </div>
          <div class="col-auto form-check form-switch ms-lg-2">
            <input class="form-check-input" type="checkbox" role="switch" id="islamicToggle">
            <label class="form-check-label" for="islamicToggle">Islamic dates</label>
          </div>
          <div class="col-auto form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="holidaysToggle" checked>
            <label class="form-check-label" for="holidaysToggle">U.S. holidays</label>
          </div>
          <div class="col-auto"><button class="btn btn-primary" type="submit">Go</button></div>
        </form>
      </div>

      <div class="toolbar-panel no-print mb-3">
        <div class="d-flex align-items-center justify-content-start">
          <div class="d-flex gap-2 action-bar">
            <button class="btn btn-outline-primary btn-sm" type="button" data-print-mode="month">
              <i class="bi bi-printer me-1" aria-hidden="true"></i>Print / Save PDF
            </button>
            <button class="btn btn-outline-secondary btn-sm" type="button" id="exportImageBtn">
              <i class="bi bi-image me-1" aria-hidden="true"></i>Export image
            </button>
            <button class="btn btn-outline-dark btn-sm" type="button" id="clearStorageBtn">
              <i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i>Reset saved data
            </button>
          </div>
        </div>
      </div>

      <div class="mb-3 no-print d-none" id="flashMessage"></div>

      <div class="sheet-preview-wrapper" id="sheetPreviewWrapper">
        <div class="calendar-sheet" id="calendarSheet">
          <div class="sheet-header">
            <img src="AMC_logo.png" class="sheet-logo" alt="AMC logo" loading="lazy">
            <div class="calendar-title-editor">
              <h2 class="h4 mb-1" id="calendarTitle" tabindex="0" role="button" aria-label="Edit calendar title"></h2>
              <input type="text" class="form-control form-control-sm d-none" id="calendarTitleInput" maxlength="200" aria-label="Calendar title">
            </div>
          </div>
          <div class="weekday-row calendar-grid" id="weekdayHeader"></div>
          <div class="month-grid" id="calendarBody"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="eventForm" novalidate>
            <div class="modal-header">
              <div>
                <h5 class="modal-title">Event</h5>
                <p class="text-muted small mb-0">Single-day, multi-day, daily, and weekly recurring events are all supported.</p>
              </div>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="eventId">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" id="title" maxlength="200" required></div>
                <div class="col-md-3"><label class="form-label">Start date</label><input type="date" class="form-control" id="startDate" required></div>
                <div class="col-md-3"><label class="form-label">End date</label><input type="date" class="form-control" id="endDate" required></div>
                <div class="col-md-3 form-check ms-2 mt-4"><input type="checkbox" class="form-check-input" id="allDay"><label class="form-check-label" for="allDay">All day</label></div>
                <div class="col-md-3"><label class="form-label">Start time</label><input type="time" class="form-control" id="startTime"></div>
                <div class="col-md-3"><label class="form-label">End time</label><input type="time" class="form-control" id="endTime"></div>
                <div class="col-md-3"><label class="form-label">Audience</label><select class="form-select" id="audience"></select></div>
                <div class="col-md-6"><label class="form-label">Location</label><input class="form-control" id="location" maxlength="200"></div>
                <div class="col-md-3"><label class="form-label">Recurrence</label><select class="form-select" id="recurrenceType"></select></div>
                <div class="col-md-12" id="weeklyOptions"><label class="form-label">Weekly recurrence weekdays</label><div class="d-flex flex-wrap gap-3" id="weekdayCheckboxes"></div><div class="form-text">Pick one or more weekdays when using weekly recurrence.</div></div>
                <div class="col-md-12"><label class="form-label">Notes</label><textarea class="form-control" rows="3" id="notes" maxlength="5000"></textarea></div>
                <div class="col-md-12">
                  <label class="form-label">Custom per-day labels</label>
                  <div class="row g-2" id="dayLabelsContainer"></div>
                  <div class="form-text">Multi-day events auto-generate Day 1, Day 2, etc. Add overrides here if needed.</div>
                </div>
              </div>
            </div>
            <div class="modal-footer flex-column align-items-stretch gap-2">
              <div class="alert alert-danger small d-none mb-0" id="eventValidation" role="alert"></div>
              <div class="d-flex justify-content-between gap-2">
                <button type="button" class="btn btn-outline-danger d-none" id="deleteEventBtn">Delete event</button>
                <div class="ms-auto d-flex gap-2">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="submit" class="btn btn-primary">Save event</button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="position-fixed context-menu card shadow-sm d-none no-print" id="dateContextMenu">
      <button class="dropdown-item" id="contextAddEvent">Add event</button>
      <button class="dropdown-item" id="contextChangeColor">Change date background color</button>
      <button class="dropdown-item" id="contextClearColor">Clear custom date background color</button>
      <button class="dropdown-item" id="contextToggleHoliday">Hide U.S. holiday on this day</button>
      <button class="dropdown-item" id="contextToggleIslamic">Hide Islamic date on this day</button>
    </div>
    <div class="position-fixed context-menu card shadow-sm d-none no-print" id="eventContextMenu">
      <button class="dropdown-item" id="contextEditEvent">Edit event</button>
      <button class="dropdown-item text-danger" id="contextDeleteEvent">Delete event</button>
    </div>
    <input type="color" id="dateColorPicker" class="visually-hidden" value="#fef3c7">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app/static/js/static-app.js"></script>
  </body>
</html>
